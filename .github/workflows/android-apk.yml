name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-sdk/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android-sdk/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n1)"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          if [[ ! -d "$SDK_ROOT/platforms/android-35" || ! -d "$SDK_ROOT/build-tools/35.0.0" ]]; then
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test SDK
        run: gradle -p android-sdk :ge360-bridge-android:testDebugUnitTest

      - name: Build installable debug APK
        run: gradle -p android-sdk :ge360-bridge-app:assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          cp android-sdk/ge360-bridge-app/build/outputs/apk/debug/ge360-bridge-app-debug.apk GE360-Bridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GE360-Bridge-APK
          path: GE360-Bridge.apk
          if-no-files-found: error
          retention-days: 30
