name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall ge360_bridge scripts/build-update-package.py
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh install-agent.sh install-relay.sh ge360-bridge ge360-agent ge360-relay scripts/*.sh
      - run: python scripts/build-update-package.py --output /tmp/ge360-update.tar.gz
      - run: python -c "from ge360_bridge.update_engine import preflight_update; r=preflight_update('/tmp/ge360-update.tar.gz', require_newer=False); assert r['preflight']=='ok'; print(r['target_version'])"
